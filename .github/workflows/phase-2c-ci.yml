name: Phase 2C CI

on:
  push:
    branches: [phase-2c-releases]
  pull_request:
    branches: [phase-2c-content-layers]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
