name: Phase 2C CI

on:
  push:
    branches: [phase-2c-releases]
  pull_request:
    branches: [phase-2c-content-layers]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse CMS SQL migrations
        run: |
          python -m pip install --quiet pglast
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql
          for path in sorted(Path("supabase/migrations").glob("*.sql")):
              parse_sql(path.read_text(encoding="utf-8"))
              print("SQL syntax OK:", path)
          PY
      - run: npm ci
      - run: npm run build
      - run: npm test
